name: Deploy

# Deploiement Vercel pilote par GitHub Actions, et non par l'integration Git de
# Vercel. Cela garantit qu'aucun build rouge ne part en production.
#
# A faire une fois dans Vercel : Settings > Git > desactiver
# "Automatic deployments from Git", sinon Vercel deploierait en parallele sans
# attendre la CI.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

# Lecture seule : le deploiement passe par la CLI Vercel et son propre jeton,
# jamais par le jeton GitHub.
permissions:
  contents: read

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    name: Deployer en production
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    environment:
      name: production
      url: ${{ vars.SITE_URL || 'https://cryptolaboratory.vercel.app' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Un deploiement non configure est *ignore*, pas en echec. Auparavant ce
      # garde-fou faisait echouer le job a chaque push, ce qui noyait les vraies
      # regressions sous des notifications rouges permanentes. Un projet qui
      # deploie via l'integration Git de Vercel n'a pas besoin de ces secrets.
      - name: Le deploiement est-il configure ?
        id: check
        run: |
          missing=""
          [ -z "${{ secrets.VERCEL_TOKEN }}" ] && missing="$missing VERCEL_TOKEN"
          [ -z "${{ secrets.VERCEL_ORG_ID }}" ] && missing="$missing VERCEL_ORG_ID"
          [ -z "${{ secrets.VERCEL_PROJECT_ID }}" ] && missing="$missing VERCEL_PROJECT_ID"

          if [ -n "$missing" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "missing=$missing" >> "$GITHUB_OUTPUT"
            echo "::notice::Deploiement ignore : secrets absents :$missing"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Installer la CLI Vercel
        if: steps.check.outputs.configured == 'true'
        run: npm install --global vercel@latest

      - name: Recuperer la configuration de production
        if: steps.check.outputs.configured == 'true'
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Construire
        if: steps.check.outputs.configured == 'true'
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deployer
        id: deploy
        if: steps.check.outputs.configured == 'true'
        run: |
          url=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deploye sur $url"

      - name: Verifier que le site repond
        if: steps.check.outputs.configured == 'true'
        run: |
          for attempt in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "${{ steps.deploy.outputs.url }}")
            if [ "$code" = "200" ]; then
              echo "Le site repond 200."
              exit 0
            fi
            echo "  tentative $attempt/10 : code $code"
            sleep 10
          done
          echo "::error::Le site ne repond pas 200 apres le deploiement."
          exit 1

      - name: Resume
        if: always()
        run: |
          if [ "${{ steps.check.outputs.configured }}" != "true" ]; then
            {
              echo "### Deploiement frontend — ignore"
              echo ""
              echo "Secrets absents :\`${{ steps.check.outputs.missing }}\`"
              echo ""
              echo "Deux facons de mettre le frontend en ligne :"
              echo ""
              echo "1. **Integration Git de Vercel** — Vercel redeploie a chaque"
              echo "   push. Simple, mais sans attendre la CI. Ce workflow reste inactif."
              echo "2. **Deploiement pilote par la CI** — \`npx vercel link\` donne"
              echo "   \`orgId\` et \`projectId\` dans \`.vercel/project.json\` ; le jeton"
              echo "   vient de Vercel > Account Settings > Tokens. Desactiver alors"
              echo "   les deploiements automatiques dans Vercel > Settings > Git."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### Deploiement frontend"
              echo ""
              echo "- Commit : \`${{ github.sha }}\`"
              echo "- URL : ${{ steps.deploy.outputs.url }}"
              echo "- Resultat : ${{ job.status }}"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  preview:
    name: Deploiement de previsualisation
    runs-on: ubuntu-latest
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Meme regle que pour la production : sans jeton, on s'abstient au lieu
      # d'echouer sur chaque pull request.
      - name: Le deploiement est-il configure ?
        id: check
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Previsualisation ignoree : VERCEL_TOKEN n'est pas defini."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Installer la CLI Vercel
        if: steps.check.outputs.configured == 'true'
        run: npm install --global vercel@latest

      - name: Construire et deployer la previsualisation
        if: steps.check.outputs.configured == 'true'
        run: |
          vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
          vercel build --token=${{ secrets.VERCEL_TOKEN }}
          url=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "Previsualisation : $url" >> "$GITHUB_STEP_SUMMARY"
